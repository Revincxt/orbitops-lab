[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orbitops-lab"
version = "0.1.0.dev0"
description = "A reproducible scheduling laboratory for agile Earth-observation satellites."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Revincxt" }]
keywords = ["satellite", "scheduling", "optimization", "simulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
orbitops = "orbitops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["packages/orbitops"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["orbitops"]
mypy_path = "packages"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["orbitops"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
