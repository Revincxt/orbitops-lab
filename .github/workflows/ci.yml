name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=orbitops --cov-report=term-missing
      - run: uv run orbitops validate scenarios/examples/demo.json

  package-and-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: node --check packages/orbitops/web/static/app.js
      - run: uv run python scripts/build_pages.py --output site
      - run: uv build
      - run: unzip -l dist/*.whl | rg 'orbitops/web/static/(index.html|app.css|app.js)'
